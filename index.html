function unitCards() {
  return `<div class="ugrid">${UNITS.map((u) => {
    const ws = unitWords(u); const done = ws.filter((id) => ST.learned[id]).length; const b = bestMock(u.id);
    return `<button class="ucard" data-go="unit|${u.id}"><span class="ut">${pic(u.pic, { small: true })}</span><span class="un en">${u.id === 'L' ? 'Starter' : uLabel(u)}</span><span class="ue en">${esc(u.en)}</span><span class="uz">${esc(u.zh)}</span><span class="us">${done}/${ws.length} 字${b !== null ? `｜考 ${b}` : ''}</span></button>`;
  }).join('')}</div>`;
}
function home() {
  stopAll(); setHash('');
  const n = Object.keys(ST.learned).length;
  const last = UMAP[ST.tab] || UNITS[0];
  let h = `<div class="hero"><div class="kicker">Look 1 課本配套複習（家長自製，非官方）</div>
  <h1>小一英文<span class="en"> 在家複習</span></h1>
  <p>13 個單元的單字、課文、句型和模擬小考。單字用自然發音拆音節，發音照劍橋字典美式音標，每個字、每個音、每一句都可以點來聽，也可以在四線格上練寫。</p></div>
  <div class="quick">
    <button class="qk main" data-go="pick"><span class="qk-ic">${pic('obj:pencil')}</span><span><b>每日單字</b><small>選老師今天指定的字</small></span></button>
    <button class="qk" data-go="unit|${last.id}-text"><span class="qk-ic">${pic(last.pic, { small: true })}</span><span><b>繼續複習 ${uLabel(last)}</b><small>${esc(last.zh)}・課文</small></span></button>
    <button class="qk" data-go="book"><span class="qk-ic">${kidBody('')}</span><span><b>我的單字本</b><small>背過 ${n} 個字</small></span></button>
    <button class="qk" data-go="quiz"><span class="qk-ic">${pic('obj:birthday')}</span><span><b>小考區</b><small>像學校考卷，整張寫完再批改</small></span></button>
  </div>
  <h2 class="h2">全部單元</h2>${unitCards()}
  <div class="howto"><h2 class="h2">怎麼用這個網站</h2><ol>
    <li><b>每天背單字</b>：到「每日單字」勾選老師當天指定的字（可以跨單元），點開每個字聽拆音節、跟著念，最後做練習。</li>
    <li><b>練寫字</b>：單字卡上按「看寫法」看一筆一筆的筆順，按「寫寫看」在四線格上先描、再聽音自己寫（手指或 Apple Pencil 都可以）。每個單元也有「寫字」分頁。</li>
    <li><b>課文複習</b>：進入單元的「課文」頁，先打開電子書聽課本原文（頁數和音檔編號都有標），再回來看導讀、聽句型、做理解問答。</li>
    <li><b>考前</b>：單元的「句型練習」和「模擬小考」一題一題練；「小考區」是一整張考卷，寫完交卷後用紅筆批改。題目都是隨機出的，跟學校考卷題型一樣、內容不同。</li></ol>
    <div class="legendbox">${legendHTML()}</div></div>`;
  render(h, 'home');
}
function unitsPage() {
  stopAll(); setHash('units');
  render(`<h1 class="ptitle">全部單元</h1>${unitCards()}`, 'units');
}

/* ================= UNIT PAGE (tabs) ================= */
function unitPage(uid, tab) {
  stopAll();
  const u = UMAP[uid] || UNITS[0];
  tab = TABS.some((t) => t[0] === tab) ? tab : 'words';
  ST.tab = u.id; save();
  setHash(`u${u.id}${tab === 'words' ? '' : '-' + tab}`);
  const ws = unitWords(u); const done = ws.filter((id) => ST.learned[id]).length; const b = bestMock(u.id);
  const idx = UNITS.indexOf(u);
  let h = `<div class="crumb"><button data-go="home">首頁</button> › <button data-go="units">單元</button> › <span>${uLabel(u)}</span></div>
  <div class="uhead">${pic(u.pic)}<div><div class="un2 en">${uLabel(u)}</div><h1 class="en">${esc(u.en)}</h1><div class="uz2">${esc(u.zh)}</div><div class="muted">${ws.length} 個字・背過 ${done} 個${b !== null ? `・小考最佳 ${b} 分` : ''}</div></div></div>
  <div class="utabs" role="tablist">${TABS.map(([k, n]) => `<button role="tab" aria-selected="${k === tab}" class="${k === tab ? 'on' : ''}" data-go="unit|${u.id}-${k}">${n}</button>`).join('')}</div>
  <div class="tabbody">`;
  if (tab === 'words') h += wordsTab(u);
  if (tab === 'write') h += writeTab(u);
  if (tab === 'text') h += textTab(u);
  if (tab === 'drill') h += drillTab(u);
  if (tab === 'mock') h += mockTab(u);
  h += `</div><div class="pager">${idx > 0 ? `<button class="btn" data-go="unit|${UNITS[idx - 1].id}-${tab}">← ${uLabel(UNITS[idx - 1])}</button>` : '<span></span>'}${idx < UNITS.length - 1 ? `<button class="btn" data-go="unit|${UNITS[idx + 1].id}-${tab}">${uLabel(UNITS[idx + 1])} →</button>` : ''}</div>`;
  render(h, u.id);
  loadBundle('common'); loadBundle(u.id);
  wireUnit(u, tab);
}
function chipHTML(id) { const w = WORDS[id]; return `<button class="chip ${w.kind === 'phrase' ? 'wide' : ''}" data-w="${id}">${ST.learned[id] ? `<span class="done">✓</span>` : ''}${thumb(w)}<span class="w">${esc(w.w)}</span><span class="z">${esc(w.zh)}</span></button>`; }
function wordsTab(u) {
  let h = `<div class="row" style="margin-bottom:6px"><button class="btn sun" data-go="pick|${u.id}">選字開始背 →</button><button class="btn" id="randw">隨機練 8 個字</button></div><p class="muted" style="margin:0 0 4px">點任何一個字聽發音。</p>`;
  for (const g of u.groups) h += `<div class="grp"><h2>${esc(g.name)} <small>${esc(g.en)}</small></h2><div class="chips">${g.words.map(chipHTML).join('')}</div></div>`;
  return h;
}
function writeTab(u) {
  const ws = unitWords(u).filter((id) => WORDS[id].kind === 'word');
  const wrote = ST.wrote || {};
  let h = `<div class="wintro">${fourWord('Look', 'solid')}<div><b>寫字練習</b><p>每個字三步：①看筆順動畫 ②沿著淺色字描 ③聽聲音自己寫，再對答案。iPad 可以用手指或 Apple Pencil 寫。</p></div></div>
  <div class="row" style="margin:6px 0 4px"><button class="btn sm" id="wall">全選</button><button class="btn sm" id="wnone">清除</button><span class="sp"></span><span class="muted">已選 <b id="wn">0</b> 個</span><button class="btn sun" id="wgo" disabled>開始寫 →</button></div>`;
  for (const g of u.groups) {
    const gw = g.words.filter((id) => WORDS[id].kind === 'word');
    if (!gw.length) continue;
    h += `<div class="grp"><h2>${esc(g.name)} <small>${esc(g.en)}</small></h2><div class="chips">${gw.map((id) => { const w = WORDS[id]; return `<button class="chip wsel" data-ws="${id}">${wrote[id] ? `<span class="done">✍️ ${wrote[id]}</span>` : ''}${thumb(w)}<span class="w">${esc(w.w)}</span><span class="z">${esc(w.zh)}</span></button>`; }).join('')}</div></div>`;
  }
  return h;
}
function drillTab(u) {
  let h = `<div class="menu"><button class="door main" data-story="1">${pic(u.story.lines[0].pic, { small: true })}<span><b>延伸故事：${esc(u.story.title)}</b><small>${esc(u.story.zh)}・自編小故事（不是課本課文）</small></span><span class="go">›</span></button>
  <button class="door" data-d="__tf">${pic('e:✅')}<span><b>故事是非題</b><small class="en">${esc(u.story.title)}</small></span><span class="go">›</span></button>`;
  h += u.drills.map((d) => `<button class="door" data-d="${d.id}">${pic(d.pic, { small: true })}<span><b>${esc(d.name)}</b><small class="en">${esc(d.en)}</small></span><span class="go">›</span></button>`).join('');
  return h + `</div><div class="note">每一組練習都是隨機出題，可以重複做。答錯的題目會在最後再出現一次。</div>`;
}
function mockTab(u) {
  const hist = (ST.mock[u.id] || []).slice(-5).reverse();
  const total = mockItemsCount(u);
  return `<div class="card">
  <div style="font-size:20px;font-weight:700">${esc(u.en)} 模擬小考</div>
  <ul style="margin:0;padding-left:20px;display:grid;gap:4px"><li>一共 ${total} 題，大約 ${Math.max(5, Math.round(total / 2))} 分鐘。</li><li>內容：${u.mock.map((m) => esc(m[1].split('、')[1] || m[1])).join('、')}。</li><li>考試時不會馬上告訴你對錯，可以按「上一題」回去改。</li><li>每次考的題目都不一樣。</li></ul>
  ${hist.length ? `<div class="section-label">最近的成績</div><div class="parts">${hist.map((m) => `<div class="part"><span>${m.date}</span><b>${m.score} 分</b></div>`).join('')}</div>` : ''}
  <div class="row"><button class="btn sun" id="begin">開始考試 →</button><button class="btn" data-go="quiz|u${u.id}">改寫一整張考卷（小考區）→</button></div></div>`;
}
function mockItemsCount(u) { return u.mock.reduce((a, [src, , n]) => a + (src === 'passage' ? 3 : src === 'reading' ? Math.min(n, ((u.text || {}).reading || { qs: [] }).qs.length) : n), 0); }
function wireUnit(u, tab) {
  qa('.tabbody .chip, .tabbody .kwc').forEach((c) => c.onclick = async () => { stopAll(); await Promise.all([loadBundle('common'), loadBundle(u.id)]); sayWord(getWord(c.dataset.w)); });
  const rw = document.getElementById('randw'); if (rw) rw.onclick = () => startPractice({ words: sample(unitWords(u).filter((id) => WORDS[id].kind === 'word'), 8), title: `${uLabel(u)} 單字練習`, back: `unit|${u.id}-words` });
  qa('[data-story]').forEach((b) => b.onclick = () => story(u.id));
  qa('[data-d]').forEach((b) => b.onclick = () => startDrill(u.id, b.dataset.d));
  const bg = document.getElementById('begin'); if (bg) bg.onclick = () => withAudio([u.id], () => runQuiz(mockItems(u), { title: `${uLabel(u)} 模擬小考`, back: `unit|${u.id}-mock`, mode: 'test', requeue: false, onDone: (q) => mockResult(u, q) }));
  qa('[data-x]').forEach((b) => b.onclick = async () => { stopAll(); const id = chain; await loadBundle(u.id); b.classList.add('on'); await saySent(b.dataset.x); if (id === chain) b.classList.remove('on'); });
  qa('[data-xs]').forEach((b) => b.onclick = async () => { stopAll(); const id = chain; await loadBundle(u.id); const lines = JSON.parse(b.dataset.xs); for (const l of lines) { if (id !== chain) return; await saySent(l); await wait(300); } });
  qa('[data-rq]').forEach((b) => b.onclick = () => readingQuiz(u));
  if (tab === 'write') {
    const sel = new Set();
    const upd = () => { document.getElementById('wn').textContent = sel.size; document.getElementById('wgo').disabled = !sel.size; qa('[data-ws]').forEach((c) => c.classList.toggle('on', sel.has(c.dataset.ws))); };
    qa('[data-ws]').forEach((c) => c.onclick = async () => { const id = c.dataset.ws; if (sel.has(id)) sel.delete(id); else { sel.add(id); stopAll(); await Promise.all([loadBundle('common'), loadBundle(u.id)]); sayWord(WORDS[id]); } upd(); });
    document.getElementById('wall').onclick = () => { unitWords(u).filter((id) => WORDS[id].kind === 'word').forEach((id) => sel.add(id)); upd(); };
    document.getElementById('wnone').onclick = () => { sel.clear(); upd(); };
    document.getElementById('wgo').onclick = () => writeWords([...sel], { title: `${uLabel(u)} 寫字`, back: `unit|${u.id}-write` });
  }
}

/* ================= TEXT TAB (課文) ================= */
function patHTML(p) { return esc(p).replace(/\[([^\]]+)\]/g, '<span class="slot2">$1</span>'); }
function exRow(e) { return `<button class="exrow" data-x="${esc(e.en)}">${e.pic ? `<span class="ex-ic">${pic(e.pic, { small: true })}</span>` : ''}<span class="ex-tx"><span class="s en">${esc(e.en)}</span><span class="t">${esc(e.zh)}</span></span><span class="say">🔊</span></button>`; }
function textTab(u) {
  const T = u.text;
  if (!T) return `<div class="note">這個單元的課文整理中。</div>`;
  let h = `<p class="lead">先打開電子書，照下面標的頁數和音檔聽課本原文、跟著念兩次，再回來這裡看懂、聽句型、做問答。</p>`;
  const R = T.reading;
  if (R) {
    h += `<section class="sec"><div class="sec-h"><span class="tag r">閱讀 Reading</span><span class="ref">課本 p.${esc(R.page)}・音檔 ${esc(R.track)}</span></div>
    <h3>${esc(R.topic)}</h3>
    <ul class="sum">${R.summary.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
    ${R.keywords && R.keywords.length ? `<div class="kwrow"><span class="kwl">重點字</span>${R.keywords.map((id) => { const w = WORDS[id]; return w ? `<button class="kwc" data-w="${id}"><span class="en">${esc(w.w)}</span><small>${esc(w.zh)}</small></button>` : ''; }).join('')}</div>` : ''}
    ${R.key && R.key.length ? `<div class="sub">課文裡的重點句型</div><div class="exs">${R.key.map(exRow).join('')}</div>` : ''}
    <div class="row"><button class="btn sun" data-rq="1">課文理解問答（${R.qs.length} 題）</button></div></section>`;
  }
  for (const g of T.grammar || []) {
    h += `<section class="sec"><div class="sec-h"><span class="tag g">句型 Grammar</span><span class="ref">課本 p.${esc(g.page)}${g.track ? `・音檔 ${esc(g.track)}` : ''}</span></div>
    <div class="pats">${g.patterns.map((p) => `<div class="pat en">${patHTML(p)}</div>`).join('')}</div>
    <div class="pz">${esc(g.zh)}</div>
    ${g.note ? `<div class="tip"><b>記住</b><span>${esc(g.note)}</span></div>` : ''}
    <div class="exs">${g.ex.map(exRow).join('')}</div>
    <div class="row"><button class="btn sm" data-xs="${esc(JSON.stringify(g.ex.map((e) => e.en)))}">▶ 例句全部聽一次</button>${g.drill ? `<button class="btn sm" data-d="${g.drill}">練習這個句型 →</button>` : ''}</div></section>`;
  }
  if (T.video) {
    const V = T.video;
    h += `<section class="sec"><div class="sec-h"><span class="tag v">影片對話 Video</span><span class="ref">課本 p.${esc(V.page)}・${esc(V.track)}</span></div>
    <div class="dlg">${V.lines.map((l, k) => `<button class="bub ${k % 2 ? 'b' : 'a'}" data-x="${esc(l.en)}"><span class="en">${esc(l.en)}</span><small>${esc(l.zh)}</small></button>`).join('')}</div>
    <div class="pz">${esc(V.zh)}</div></section>`;
  }
  const extra = [];
  if (T.song) extra.push(`<div class="mini2"><span class="tag s">歌曲 Song</span><div>${esc(T.song.zh)}</div><div class="ref">課本 p.${esc(T.song.page)}${T.song.track ? '・音檔 ' + esc(T.song.track) : ''}（請在電子書播放）</div></div>`);
  if (T.value) extra.push(`<div class="mini2"><span class="tag val">品德 Value</span><div class="en" style="font-weight:700">${esc(T.value.en)}</div><div>${esc(T.value.zh)}</div></div>`);
  if (T.extra) T.extra.forEach((x) => extra.push(`<div class="mini2"><span class="tag x">${esc(x.tag)}</span><div><b>${esc(x.title)}</b></div><div>${esc(x.zh)}</div>${x.page ? `<div class="ref">課本 p.${esc(x.page)}${x.track ? '・音檔 ' + esc(x.track) : ''}</div>` : ''}</div>`));
  if (extra.length) h += `<div class="minis">${extra.join('')}</div>`;
  h += `<section class="sec soft"><div class="sec-h"><span class="tag x">延伸故事（自編）</span></div><p style="margin:0">用這課的字和句型另外寫的小故事「<span class="en">${esc(u.story.title)}</span>」，不是課本課文，可以當課外閱讀，一句一句聽。</p><div class="row"><button class="btn" data-story="1">看故事 →</button></div></section>`;
  return h;
}
function readingQuiz(u) {
  const R = u.text.reading;
  withAudio([u.id], () => runQuiz(R.qs.map((x) => Object.assign({ part: `課文理解・課本 p.${R.page}` }, x)), { title: `${uLabel(u)} 課文理解`, back: `unit|${u.id}-text`, mode: 'practice', onDone: (q) => drillDone(u, { id: '__rq', name: '課文理解問答', back: 'text' }, q) }));
}

/* ---- re-point older screens to the new tabs ---- */
function c2(uid) { unitPage(uid, 'drill'); }
function mockIntro(uid) { unitPage(uid, 'mock'); }
function drillDone(u, d, q) {
  const ratio = q.first / q.total; const stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : 1;
  const backTab = d.back || 'drill';
  let h = bar(d.name, `unit|${u.id}-${backTab}`);
  h += `<div class="card" style="text-align:center">${starsHTML(stars)}<div style="font-size:20px;font-weight:700">一次就答對 ${q.first} / ${q.total} 題</div></div>
  <div class="row" style="margin-top:16px"><button class="btn" id="again">再做一次</button><span class="sp"></span><button class="btn primary" data-go="unit|${u.id}-${backTab}">回${backTab === 'text' ? '課文' : '句型練習'}</button></div>`;
  render(h, u.id);
  document.getElementById('again').onclick = () => d.id === '__rq' ? readingQuiz(u) : startDrill(u.id, d.id);
  if (stars >= 2) saySent('Great job!');
}

const _pick = pick; pick = function (uid) { curActive = 'daily'; setHash('daily'); _pick(uid); };
const _book = book; book = function () { curActive = 'book'; setHash('book'); _book(); };
/* boot */
loadBundle('common');
route(location.hash);

</script>
