<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Look 1 英文複習站</title>
<meta name="description" content="Look 1 小一英文在家複習：自然發音單字、課文導讀、句型練習、模擬小考。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Look 1 複習">
<meta name="theme-color" content="#F2F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@700&display=swap">
<style>
/* Layout: one centered column (max 720px) of big touch targets; screens swap in place. */
:root {
  --bg: #F2F5F9;
  --card: #FFFFFF;
  --stage: #E6EFF9;
  --ink: #1E2A44;
  --muted: #5B6880;
  --line: #D3DCE8;
  --outline: #1E2A44;
  --cons: #2563D9;
  --vow: #E03C31;
  --team: #8B4FD6;
  --silent: #98A2B3;
  --star: #F2B21B;
  --sun: #FFC83D;
  --sun-ink: #3A2A00;
  --ok: #1F9D5B;
  --bad: #E03C31;
  --hl: rgba(255, 200, 61, .55);
  --hl-line: #F2A81B;
  --hl-top: rgba(255, 200, 61, .34);
  --guide: #9DB4D3;
  --guide-mid: #E8A0A0;
  --f-en: 'Andika', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
  --f-zh: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161F; --card: #1A2130; --stage: #222C3F; --ink: #E9EEF7; --muted: #A3AEC2; --line: #2D3850;
    --outline: #121826; --cons: #6EA2FF; --vow: #FF7369; --team: #B88CFF; --silent: #6B7487; --star: #FFC83D;
    --ok: #3CC27F; --bad: #FF7369; --hl: rgba(255, 200, 61, .38); --hl-top: rgba(255, 200, 61, .3); --guide: #45597A; --guide-mid: #7A4B55; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161F; --card: #1A2130; --stage: #222C3F; --ink: #E9EEF7; --muted: #A3AEC2; --line: #2D3850;
  --outline: #121826; --cons: #6EA2FF; --vow: #FF7369; --team: #B88CFF; --silent: #6B7487; --star: #FFC83D;
  --ok: #3CC27F; --bad: #FF7369; --hl: rgba(255, 200, 61, .38); --hl-top: rgba(255, 200, 61, .3); --guide: #45597A; --guide-mid: #7A4B55; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-zh); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.en { font-family: var(--f-en); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, .chip:focus-visible { outline: 3px solid var(--cons); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.bar h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; text-wrap: balance; }
.back { width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 20px; }
.bar .count { font-family: var(--f-en); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

/* home */
.hero { display: grid; gap: 6px; padding-block: 24px 8px; }
.hero .kicker { font-family: var(--f-en); font-weight: 700; letter-spacing: .08em; color: var(--muted); font-size: 13px; text-transform: uppercase; }
.hero h1 { font-size: clamp(28px, 7vw, 40px); margin: 0; line-height: 1.15; text-wrap: balance; }
.hero h1 .en { color: var(--cons); }
.hero p { margin: 0; color: var(--muted); max-width: 36em; }
.doors { display: grid; gap: 14px; margin-top: 20px; }
.door { display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 14px; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.door:hover { border-color: var(--cons); }
.door .pic { width: 76px; height: 76px; background: var(--stage); border-radius: 14px; }
.door b { display: block; font-size: 19px; }
.door small { color: var(--muted); display: block; }
.door .go { font-size: 22px; color: var(--muted); }
.door.main { border-color: var(--sun); box-shadow: 0 4px 0 var(--sun); }
.note { margin-top: 22px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 12px 16px; color: var(--muted); font-size: 14px; }
.note b { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 14px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }

/* word picker */
.grp { margin-top: 18px; }
.grp h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.grp h2 small { font-family: var(--f-en); color: var(--muted); font-weight: 400; }
.grp h2 .all { margin-left: auto; font-size: 13px; color: var(--cons); padding: 4px 8px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.chip { position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 6px 6px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; }
.chip .pic { width: 56px; height: 48px; }
.chip .w { font-family: var(--f-en); font-weight: 700; font-size: 18px; }
.chip .z { font-size: 12px; color: var(--muted); }
.chip.on { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 16%, var(--card)); }
.chip.on::after { content: "✓"; position: absolute; top: 4px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--sun); color: var(--sun-ink); font-weight: 700; display: grid; place-items: center; font-size: 13px; }
.chip .done { position: absolute; top: 5px; left: 6px; font-size: 11px; color: var(--ok); font-weight: 700; }
.dock { position: sticky; bottom: 0; background: var(--bg); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); margin-top: 18px; flex-wrap: wrap; }
.dock .info { flex: 1; min-width: 140px; color: var(--muted); font-size: 14px; }
.dock .info b { color: var(--ink); font-size: 18px; }
.add { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.add input { flex: 1; min-width: 160px; font-family: var(--f-en); font-size: 18px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }

/* buttons */
.btn { min-height: 48px; padding: 10px 18px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.sun { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); box-shadow: 0 3px 0 #D99E10; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.sm { min-height: 40px; padding: 6px 14px; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.c { justify-content: center; }
.sp { flex: 1; }

/* learn card */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 14px; }
.stage { background: var(--stage); border-radius: 16px; display: grid; place-items: center; padding: 10px; min-height: 200px; }
.stage .pic { width: 100%; max-height: 240px; }
.stage .pic.tall { max-height: 260px; }
.pic { display: block; max-width: 100%; height: auto; }
.pic .o { stroke: var(--outline); }
.pic .f { fill: var(--outline); }
.pic .ln { stroke: var(--muted); }
.pic .hl { fill: var(--hl); stroke: var(--hl-line); stroke-width: 3; stroke-dasharray: 7 5; }
.pic .hl.top { fill: var(--hl-top); stroke-width: 4; }
.pic .accentln { stroke: var(--hl-line); }
.pic .tagbg { fill: var(--ink); }
.pic .tagtx { fill: var(--bg); font-family: var(--f-en); font-weight: 700; font-size: 15px; }
.pic .calnum { fill: #1E2A44; font-family: var(--f-en); font-weight: 700; font-size: 36px; }
.pic .badge7 { fill: #1E2A44; font-family: var(--f-en); font-weight: 700; font-size: 17px; }
.pic .zzz { fill: #C9D3E8; font-family: var(--f-en); font-size: 12px; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .pic .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } }
@keyframes pulse { 50% { opacity: .55; } }
.mean { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mean .zh { font-size: 22px; font-weight: 700; }
.mean .unit { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }

/* tiles */
.tiles { display: flex; flex-wrap: wrap; gap: 6px 4px; justify-content: center; align-items: flex-start; }
.syl { display: grid; gap: 6px; justify-items: center; }
.syl .tr { display: flex; gap: 4px; padding-bottom: 22px; }
.syl .sb { width: 100%; min-height: 34px; border-radius: 10px; background: var(--stage); border: 2px solid var(--line); font-family: var(--f-en); font-weight: 700; font-size: 16px; padding: 2px 8px; }
.syl.on .sb { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
.dot { font-family: var(--f-en); font-size: 30px; color: var(--muted); align-self: flex-start; padding: 0 1px; line-height: 1; margin-top: 16px; }
.tile { position: relative; min-width: 50px; height: 64px; padding: 0 8px; border-radius: 12px; background: var(--card); border: 2px solid var(--line); border-bottom-width: 6px; display: grid; place-items: center; font-family: var(--f-en); font-weight: 700; font-size: 36px; line-height: 1; transition: transform .12s; }
.tile .snd { position: absolute; bottom: -27px; left: 0; right: 0; font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.tile.c { color: var(--cons); border-color: color-mix(in srgb, var(--cons) 45%, var(--line)); border-bottom-color: var(--cons); }
.tile.v, .tile.L { color: var(--vow); border-color: color-mix(in srgb, var(--vow) 45%, var(--line)); border-bottom-color: var(--vow); }
.tile.L .lt { text-decoration: overline; text-decoration-thickness: 3px; }
.tile.T { color: var(--team); border-color: color-mix(in srgb, var(--team) 45%, var(--line)); border-bottom-color: var(--team); }
.tile.e { color: var(--silent); border-style: dashed; border-bottom-width: 2px; }
.tile .st { position: absolute; top: -10px; right: -8px; width: 22px; height: 22px; }
.tile.on { transform: translateY(-6px) scale(1.06); background: color-mix(in srgb, var(--sun) 30%, var(--card)); }
.tilewrap { gap: 10px 4px; }
.claps { text-align: center; color: var(--muted); font-size: 14px; }
.claps b { font-family: var(--f-en); color: var(--ink); }

/* four-line guide (英文四線格) */
.four { position: relative; height: 92px; border-radius: 12px; background: var(--card); overflow: hidden; }
.four::before { content: ""; position: absolute; inset: 14px 0 14px; background:
  linear-gradient(var(--guide), var(--guide)) 0 0 / 100% 1px no-repeat,
  linear-gradient(var(--guide), var(--guide)) 0 33.33% / 100% 1px no-repeat,
  linear-gradient(var(--guide-mid), var(--guide-mid)) 0 66.66% / 100% 2px no-repeat,
  linear-gradient(var(--guide), var(--guide)) 0 100% / 100% 1px no-repeat; }
.four span { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--f-en); font-size: 58px; line-height: 1; bottom: 26px; letter-spacing: .02em; }
.four span.on { color: var(--cons); }

.ctl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ctl .btn { padding: 8px; font-size: 15px; }
.ex { background: var(--stage); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.ex .s { font-family: var(--f-en); font-size: 22px; }
.ex .s mark { background: none; color: var(--cons); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
.ex .t { color: var(--muted); font-size: 14px; }
.tip { font-size: 15px; display: flex; gap: 8px; }
.tip b { flex: none; color: var(--team); }
.prog { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.prog i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.prog i.on { background: var(--ink); width: 24px; border-radius: 6px; }
.prog i.done { background: var(--ok); }

/* practice */
.q { display: grid; gap: 14px; }
.q .ask { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.q .ask .en { font-weight: 400; font-size: 22px; }
.big-say { width: 88px; height: 88px; border-radius: 50%; background: var(--sun); color: var(--sun-ink); display: grid; place-items: center; font-size: 36px; margin: 0 auto; box-shadow: 0 4px 0 #D99E10; }
.say { width: 44px; height: 44px; border-radius: 50%; background: var(--sun); color: var(--sun-ink); display: inline-grid; place-items: center; font-size: 20px; flex: none; }
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opt { background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 8px; display: grid; place-items: center; min-height: 64px; }
.opt .pic { width: 100%; max-height: 120px; }
.opt.txt { font-family: var(--f-en); font-size: 22px; font-weight: 700; padding: 12px; }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--card)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card)); }
.opt.pick { border-color: var(--cons); background: color-mix(in srgb, var(--cons) 10%, var(--card)); }
@media (prefers-reduced-motion: no-preference) { .shake { animation: shake .35s; } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.qpic { background: var(--stage); border-radius: 16px; padding: 10px; display: grid; place-items: center; }
.qpic .pic { width: 100%; max-height: 200px; }
.slots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.slot { min-width: 50px; height: 64px; border-radius: 12px; border: 3px dashed var(--line); display: grid; place-items: center; font-family: var(--f-en); font-weight: 700; font-size: 34px; padding: 0 8px; }
.slot.filled { border-style: solid; }
.bank { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.bank .tile { cursor: pointer; }
.bank .tile.used { visibility: hidden; }
.gap { display: inline-block; min-width: 54px; border-bottom: 4px solid var(--ink); text-align: center; color: var(--cons); }
.sentence { font-family: var(--f-en); font-size: 26px; text-align: center; line-height: 1.4; }
.feedback { min-height: 28px; text-align: center; font-weight: 700; }
.feedback.ok { color: var(--ok); }
.feedback.no { color: var(--bad); }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfbtn { min-height: 72px; border-radius: 16px; border: 3px solid var(--line); background: var(--card); font-size: 34px; font-weight: 700; }
.tfbtn.t { color: var(--ok); }
.tfbtn.f { color: var(--bad); }
.tfbtn.pick { border-color: var(--cons); }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; }
.match .opt { min-height: 54px; }

/* story */
.lines { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px; text-align: left; width: 100%; }
.line .pic { width: 96px; height: 80px; background: var(--stage); border-radius: 12px; }
.line .s { font-family: var(--f-en); font-size: 20px; line-height: 1.35; }
.line .t { color: var(--muted); font-size: 14px; }
.line.on { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 14%, var(--card)); }
.hidezh .line .t { display: none; }

/* results */
.stars { display: flex; justify-content: center; gap: 8px; }
.stars svg { width: 56px; height: 56px; }
.score { text-align: center; font-family: var(--f-en); font-weight: 700; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 22px; color: var(--muted); }
.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.item .w { font-family: var(--f-en); font-weight: 700; font-size: 20px; }
.item small { color: var(--muted); display: block; }
.mark { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #FFFFFF; }
.mark.ok { background: var(--ok); }
.mark.no { background: var(--bad); }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.part { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.part b { font-family: var(--f-en); font-variant-numeric: tabular-nums; }
.menu { display: grid; gap: 10px; }
.section-label { font-family: var(--f-en); font-weight: 700; color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-top: 8px; }
.confirm { background: var(--card); border: 2px solid var(--bad); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.ico { width: 34px; height: 34px; }
@media (max-width: 420px) {
  .card { padding: 12px; }
  .tile { min-width: 38px; height: 52px; font-size: 28px; padding: 0 5px; border-radius: 10px; }
  .tile .snd { font-size: 12px; bottom: -25px; }
  .syl .tr { gap: 3px; }
  .dot { margin-top: 12px; font-size: 24px; }
  .slot { min-width: 42px; height: 56px; font-size: 28px; }
  .four span { font-size: 46px; }
  .opts.three { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .line { grid-template-columns: 72px 1fr; }
  .line .pic { width: 72px; height: 64px; }
}

/* additions for the all-units version */
.muted { color: var(--muted); }
.doors.two { grid-template-columns: 1fr; }
@media (min-width: 640px) { .doors.two { grid-template-columns: 1fr 1fr; } }
.ugrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; margin-top: 8px; }
.ucard { display: grid; grid-template-columns: 52px 1fr; grid-template-rows: auto auto auto auto; column-gap: 10px; align-items: center; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; min-width: 0; }
.ucard:hover { border-color: var(--cons); }
.ucard .ut { grid-row: 1 / span 4; width: 52px; height: 52px; background: var(--stage); border-radius: 12px; display: grid; place-items: center; overflow: hidden; }
.ucard .ut .pic { width: 52px; height: 52px; }
.ucard .un { font-weight: 700; font-size: 13px; color: var(--muted); letter-spacing: .03em; }
.ucard .ue { font-weight: 700; font-size: 16px; line-height: 1.2; min-width: 0; }
.ucard .uz { font-size: 13px; color: var(--muted); }
.ucard .us { font-size: 12px; color: var(--ok); font-weight: 700; font-variant-numeric: tabular-nums; }
.uhead { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; margin-bottom: 14px; }
.uhead .pic { width: 84px; height: 84px; background: var(--stage); border-radius: 16px; }
.uz2 { font-size: 22px; font-weight: 700; }
.bar h1 .en { font-weight: 400; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }

.utitle { margin-top: 14px; font-weight: 700; font-size: 18px; }

.phrase { font-size: clamp(26px, 7vw, 36px); text-align: center; line-height: 1.3; padding: 8px 4px; text-wrap: balance; }
.ctl.two { grid-template-columns: 1fr 1fr; }
.loading { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 80px 0; color: var(--muted); font-weight: 700; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--cons); }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin .8s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.mini { display: block; width: 64px; background: var(--stage); border-radius: 10px; margin: 2px 0 4px; }
.opts.one { grid-template-columns: 1fr; }

.pic .card-bg { fill: var(--card); stroke: var(--line); stroke-width: 2; }

.pic .opsign { fill: var(--ink); font-family: var(--f-en); font-weight: 700; font-size: 30px; }
.q .sentence:empty { display: none; }

/* ---------- website shell ---------- */
.top { background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 17px; color: var(--ink); }
.brand svg { width: 36px; height: 36px; flex: none; }

.nav { display: flex; gap: 4px; margin-left: auto; }
.nav button { min-height: 40px; padding: 6px 14px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.nav button:hover { color: var(--ink); background: var(--stage); }
.nav button.on { color: var(--ink); background: var(--stage); box-shadow: inset 0 -3px 0 var(--sun); }
@media (max-width: 640px) {

}
.layout { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1fr; }
.side { display: none; }
@media (min-width: 980px) {
  .layout { grid-template-columns: 240px minmax(0, 1fr); gap: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .side { display: block; }
  .side-in { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding-block: 16px 24px; display: grid; gap: 4px; }
  .layout .wrap { padding-left: 16px; }
}
.side-l, .side-u { display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: center; text-align: left; padding: 6px 10px; border-radius: 12px; }
.side-l:hover, .side-u:hover { background: var(--stage); }
.side-l.on, .side-u.on { background: var(--card); box-shadow: inset 3px 0 0 var(--sun), 0 0 0 1px var(--line); }
.side-l .pic, .side-u .pic { width: 38px; height: 38px; }
.side-l span { font-weight: 700; }
.sp-ic { width: 38px; height: 38px; display: grid; place-items: center; background: var(--stage); border-radius: 10px; overflow: hidden; }
.side-u b { display: block; font-size: 14px; }
.side-u small { color: var(--muted); font-size: 12px; }
.side-h { font-family: var(--f-en); font-weight: 700; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 14px 10px 2px; }

/* home */
.hero h1 { font-size: clamp(30px, 7vw, 44px); }
.hero h1 .en { color: var(--cons); }
.quick { display: grid; gap: 10px; margin-top: 18px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .quick { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .quick { grid-template-columns: repeat(4, 1fr); } }
.qk { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; }
.qk:hover { border-color: var(--cons); }
.qk.main { border-color: var(--sun); box-shadow: 0 4px 0 var(--sun); }
.qk-ic { width: 56px; height: 56px; background: var(--stage); border-radius: 12px; display: grid; place-items: center; overflow: hidden; }
.qk-ic .pic { width: 56px; height: 56px; }
.qk b { display: block; font-size: 17px; }
.qk small { color: var(--muted); }
.h2 { font-size: 20px; margin: 28px 0 10px; text-wrap: balance; }
.ptitle { font-size: 26px; margin: 18px 0 12px; }
.howto { margin-top: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 4px 18px 16px; }
.howto .h2 { margin-top: 14px; }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 62ch; }
.legendbox { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }

/* unit page */
.crumb { font-size: 14px; color: var(--muted); padding-top: 14px; }
.crumb button { color: var(--cons); font-weight: 700; padding: 2px 0; }
.uhead { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: center; margin: 10px 0 14px; }
.uhead > .pic { width: 92px; height: 92px; background: var(--stage); border-radius: 18px; }
.uhead h1 { margin: 0; font-size: clamp(24px, 6vw, 32px); line-height: 1.15; }
.un2 { font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.utabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-block: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.utabs button { min-height: 44px; border-radius: 12px; font-weight: 700; color: var(--muted); background: var(--card); border: 2px solid var(--line); font-size: 15px; }
.utabs button.on { color: var(--sun-ink); background: var(--sun); border-color: var(--sun); }
.tabbody { display: grid; gap: 14px; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); }

/* 課文 sections */
.lead { margin: 0; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 10px 14px; color: var(--muted); }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.sec.soft { background: var(--stage); border-color: transparent; }
.sec-h { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.sec h3 { margin: 0; font-size: 20px; text-wrap: balance; }
.tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--stage); }
.tag.r { background: color-mix(in srgb, var(--cons) 16%, var(--card)); color: var(--cons); }
.tag.g { background: color-mix(in srgb, var(--team) 16%, var(--card)); color: var(--team); }
.tag.v { background: color-mix(in srgb, var(--ok) 16%, var(--card)); color: var(--ok); }
.tag.s, .tag.val, .tag.x { background: color-mix(in srgb, var(--sun) 30%, var(--card)); color: var(--ink); }
.ref { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sum { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: 64ch; }
.kwrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kwl { font-size: 13px; color: var(--muted); font-weight: 700; margin-right: 4px; }
.kwc { display: inline-flex; gap: 6px; align-items: baseline; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); }
.kwc .en { font-weight: 700; font-size: 17px; }
.kwc small { color: var(--muted); }
.kwc:hover { border-color: var(--cons); }
.sub { font-size: 13px; font-weight: 700; color: var(--muted); }
.pats { display: grid; gap: 6px; }
.pat { font-size: clamp(22px, 5.6vw, 28px); line-height: 1.35; }
.slot2 { display: inline-block; padding: 0 8px; border-radius: 8px; border: 2px dashed var(--team); color: var(--team); font-weight: 700; }
.pz { font-size: 16px; }
.exs { display: grid; gap: 8px; }
.exrow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--stage); border: 2px solid transparent; border-radius: 14px; padding: 8px 10px; width: 100%; }
.exrow:hover { border-color: var(--line); }
.exrow.on { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 16%, var(--card)); }
.ex-ic { width: 56px; height: 50px; display: grid; place-items: center; }
.ex-ic .pic { width: 56px; height: 50px; }
.ex-tx { display: grid; min-width: 0; }
.exrow .s { font-size: 20px; line-height: 1.3; }
.exrow .t { color: var(--muted); font-size: 14px; }
.dlg { display: grid; gap: 8px; }
.bub { max-width: 85%; display: grid; text-align: left; padding: 10px 14px; border-radius: 18px; background: var(--stage); border: 2px solid transparent; }
.bub .en { font-size: 20px; }
.bub small { color: var(--muted); }
.bub.a { justify-self: start; border-bottom-left-radius: 6px; }
.bub.b { justify-self: end; background: color-mix(in srgb, var(--ok) 14%, var(--card)); border-bottom-right-radius: 6px; }
.bub.on { border-color: var(--sun); }
.minis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.mini2 { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.mini2 .tag { justify-self: start; }
@media (max-width: 420px) {
  .utabs button { font-size: 14px; }
  .exrow .s { font-size: 18px; }
  .uhead { grid-template-columns: 72px 1fr; }
  .uhead > .pic { width: 72px; height: 72px; }
}

/* ---------- 小考區 (paper-style quiz) ---------- */
:root { --ink-red: #D7261E; --paper: #FFFFFF; --rule: #C9D4E3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink-red: #FF6B61; --paper: #1A2130; --rule: #34405A; } }
:root[data-theme="dark"] { --ink-red: #FF6B61; --paper: #1A2130; --rule: #34405A; }
.qzgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.qzc { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
.qzc:hover { border-color: var(--cons); }
.qzc b { display: block; font-size: 15px; }
.qzc small { color: var(--muted); font-size: 12px; }
.qz-ic { width: 44px; height: 44px; background: var(--stage); border-radius: 10px; display: grid; place-items: center; overflow: hidden; }
.qz-ic .pic { width: 44px; height: 44px; }
.qz-rv { font-weight: 700; font-size: 20px; color: var(--team); }
.qz-s { position: absolute; top: -8px; right: -6px; min-width: 34px; height: 26px; border-radius: 13px; background: var(--paper); border: 2px solid var(--ink-red); color: var(--ink-red); font-family: 'Caveat', var(--f-en); font-weight: 700; font-size: 18px; display: grid; place-items: center; padding: 0 6px; }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 1px 0 var(--rule), 0 10px 30px -18px rgba(30, 42, 68, .35); padding: 18px clamp(12px, 3vw, 28px) 24px; display: grid; gap: 4px; }
.sh-head { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 6px 14px; align-items: start; border-bottom: 3px double var(--rule); padding-bottom: 12px; margin-bottom: 6px; }
.sh-title { font-weight: 700; font-size: 26px; letter-spacing: .02em; }
.sh-sub { font-weight: 700; color: var(--muted); }
.sh-fields { grid-column: 1; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
.sh-fields .line { display: inline-block; width: 110px; border-bottom: 1.5px solid var(--rule); height: 1em; vertical-align: -2px; }
.sh-score { grid-column: 2; grid-row: 1 / span 2; width: 92px; height: 92px; border-radius: 50%; border: 2px dashed var(--rule); display: grid; place-items: center; align-content: center; font-family: 'Caveat', var(--f-en); color: var(--muted); }
.sh-score span { font-size: 18px; }
.sh-score.graded { border: 3px solid var(--ink-red); color: var(--ink-red); transform: rotate(-8deg); }
.sh-score b { font-size: 46px; line-height: .9; }
.sh-sec { margin-top: 14px; font-weight: 700; font-size: 13px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; border-top: 1px solid var(--rule); padding-top: 10px; }
.qpart { padding-block: 10px 6px; }
.qpart h3 { margin: 0; font-size: 18px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.pn { flex: none; font-size: 13px; font-weight: 700; color: var(--paper); background: var(--ink); border-radius: 6px; padding: 2px 8px; }
.pzh { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
.pitems { display: grid; gap: 10px; }
.qi { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 10px 44px 10px 10px; border-radius: 12px; border: 1px dashed transparent; }
.qi:hover { border-color: var(--rule); }
.qn { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); font-family: var(--f-en); font-weight: 700; font-size: 14px; display: grid; place-items: center; }
.qi > .qmark { position: absolute; right: 8px; top: 6px; font-family: 'Caveat', var(--f-en); font-weight: 700; font-size: 32px; color: var(--ink-red); line-height: 1; }
.qi.badq > .qmark, .qi.halfq > .qmark { font-size: 26px; }
.say.sm { width: 40px; height: 40px; font-size: 17px; position: relative; }
.say.sm b { position: absolute; bottom: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 11px; display: grid; place-items: center; }
.qpic2 { width: 74px; height: 64px; display: grid; place-items: center; background: var(--stage); border-radius: 10px; flex: none; }
.qpic2 .pic { width: 74px; height: 64px; }
/* tick */
.tickrow { display: grid; grid-template-columns: repeat(3, minmax(0, 104px)); gap: 10px; }
.tk { display: grid; justify-items: center; gap: 4px; padding: 6px; border: 2px solid var(--rule); border-radius: 10px; background: var(--paper); }
.tk .pic { width: 80px; height: 70px; }
.tk .box { width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 4px; display: grid; place-items: center; font-weight: 700; font-size: 20px; }
.tk.sel .box::after { content: "✓"; color: var(--cons); }
.tk.right { border-color: var(--ink-red); }
.tk.right .box { border-color: var(--ink-red); }
.tk.wrongc .box::after { content: "✓"; color: var(--muted); text-decoration: line-through; }
/* circle buttons */
.circs { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.circs.wrap { margin-top: 6px; }
.cb, .cw { min-width: 44px; min-height: 40px; padding: 4px 12px; border-radius: 999px; border: 2px solid transparent; font-weight: 700; font-size: 18px; background: var(--stage); }
.cw { min-height: 34px; padding: 0 8px; background: none; border-color: transparent; font-size: inherit; }
.cb.sel, .cw.sel { border-color: var(--cons); background: color-mix(in srgb, var(--cons) 10%, var(--paper)); }
.cb.right, .cw.right { border-color: var(--ink-red); color: var(--ink-red); }
.cb.wrongc, .cw.wrongc { text-decoration: line-through; color: var(--muted); }
.tfb { font-size: 22px; }
.tfs, .csent, .rqs { font-size: 20px; line-height: 1.5; }
.wgap2 { font-size: 30px; letter-spacing: .04em; }
.wgap2 u { text-decoration: none; border-bottom: 3px solid var(--ink); color: var(--cons); }
.rqb { flex: 1; min-width: 220px; }
/* lines */
.lines-box { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 10px clamp(40px, 12vw, 120px); width: 100%; }
.lines-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.lines-svg line { stroke: var(--cons); stroke-width: 3; stroke-linecap: round; }
.lines-svg line.okl { stroke: var(--ok); }
.lines-svg line.badl { stroke: var(--ink-red); stroke-dasharray: 6 5; }
.lcol, .rcol { display: grid; gap: 10px; align-content: space-around; }
.rcol { grid-template-columns: repeat(2, minmax(0, 120px)); justify-content: end; }
.lnum { display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 10px; border-radius: 999px; background: var(--sun); color: var(--sun-ink); font-weight: 700; position: relative; }
.lnum .n { width: 24px; height: 24px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-size: 14px; }
.lnum.sel { outline: 3px solid var(--cons); }
.lpic { position: relative; border: 2px solid var(--rule); border-radius: 10px; padding: 4px; background: var(--paper); }
.lpic .pic { width: 100%; height: 70px; }
.dotp { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.lnum .dotp { right: -14px; top: calc(50% - 5px); }
.lpic .dotp { left: -7px; top: calc(50% - 5px); }
@media (max-width: 480px) { .rcol { grid-template-columns: 1fr; } .lpic .pic { height: 56px; } }
/* color */
.crayons { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.crayon { width: 38px; height: 38px; border-radius: 50% 50% 8px 8px; background: var(--cc); border: 2px solid var(--outline); }
.crayon.sel { transform: translateY(-6px); box-shadow: 0 6px 0 -2px var(--cons); }
.cobjs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.cobj { display: grid; justify-items: center; gap: 6px; }
.cpaint { width: 100%; max-width: 130px; border: 2px dashed var(--rule); border-radius: 12px; padding: 6px; background: #FFFFFF; }
.cpaint .pic { width: 100%; height: 90px; }
/* yes / no */
.scene { width: 100%; max-width: 520px; }
.scene .pic { width: 100%; height: auto; }
.pic .scn-bg { fill: #CDE8FB; }
.pic .scn-ground { fill: #A8D88E; }
.ynl { margin: 0; padding-left: 22px; display: grid; gap: 8px; width: 100%; }
.ynl li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; font-size: 19px; }
/* unscramble */
.unscr { display: grid; gap: 8px; }
.scr, .slots2 { display: flex; gap: 6px; flex-wrap: wrap; }
.lt2 { width: 40px; height: 44px; border-radius: 8px; border: 2px solid var(--line); border-bottom-width: 4px; font-weight: 700; font-size: 22px; background: var(--paper); }
.lt2.used { opacity: .25; }
.sl2 { width: 40px; height: 44px; border: none; border-bottom: 3px solid var(--ink); font-weight: 700; font-size: 24px; color: var(--cons); background: none; }
/* cloze */
.wbox { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 2px solid var(--ink); border-radius: 10px; width: 100%; }
.wb { display: grid; justify-items: center; gap: 2px; padding: 4px 8px; border-radius: 8px; background: var(--stage); font-weight: 700; }
.wb .pic { width: 52px; height: 42px; }
.ctext { font-size: 19px; line-height: 2.1; width: 100%; }
.ctext p { margin: 0; }
.gap2 { display: inline-flex; align-items: baseline; gap: 4px; min-width: 96px; padding: 0 6px; border-bottom: 2.5px solid var(--ink); font-size: inherit; vertical-align: baseline; }
.gap2 b { font-size: 12px; color: var(--muted); }
.gap2 span { color: var(--cons); font-weight: 700; }
.gap2.cur { background: color-mix(in srgb, var(--sun) 30%, var(--paper)); }
.gap2.right span { color: var(--ink); }
.gap2.right { border-bottom-color: var(--ok); }
.gap2.wrongc span { text-decoration: line-through; color: var(--muted); }
.gap2 em { font-style: normal; font-family: 'Caveat', var(--f-en); font-weight: 700; font-size: 22px; color: var(--ink-red); }
.fix { width: 100%; font-size: 14px; color: var(--ink-red); }
.sh-foot { display: grid; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 3px double var(--rule); }
.sh-foot > .btn { justify-self: center; min-width: 200px; }
.sh-result { text-align: center; font-size: 18px; }
.sh-result b { color: var(--ink-red); }
.qi.okq { background: color-mix(in srgb, var(--ok) 5%, transparent); }
.qi.badq { background: color-mix(in srgb, var(--ink-red) 5%, transparent); }

/* ---------- Chinese + 注音 word cards ---------- */
.pic.zhcard { display: grid; place-items: center; container-type: inline-size; overflow: hidden; }
.zhin { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; row-gap: .1em; font-weight: 700; color: var(--ink); line-height: 1.05; font-size: min(calc(100cqw / 3.1), 28px); }
.zhcard[data-n="2"] .zhin { font-size: min(calc(100cqw / 3.1), 40px); }
.zhcard[data-n="1"] .zhin { font-size: min(calc(100cqw / 1.8), 44px); }
@container (min-width: 250px) { .zhin { font-size: min(calc(100cqw / (var(--n) * 1.6)), 72px); } }
.zc { display: inline-flex; align-items: center; justify-content: center; width: 1.45em; }
.zch { font-family: var(--f-zh); }
.zyc { position: relative; display: inline-flex; margin-left: .05em; font-weight: 400; }
.zys { display: flex; flex-direction: column; align-items: center; font-size: .34em; line-height: 1; }
.zys i { font-style: normal; display: block; height: 1em; width: 1em; text-align: center; }
.zt { position: absolute; left: 100%; bottom: .32em; font-size: .34em; line-height: 1; }
.zyc.lt .zt { left: 50%; bottom: auto; top: -.72em; transform: translateX(-50%); }

/* ---------- word picture + Chinese/注音 label ---------- */
.wcard { display: grid; justify-items: center; align-content: center; gap: 2px; width: 100%; container-type: inline-size; }
.cap { display: flex; flex-wrap: wrap; justify-content: center; row-gap: .05em; font-weight: 700; color: var(--ink); line-height: 1.05; font-size: clamp(15px, calc(100cqw / (var(--n) * 1.55)), 22px); }
.cap .zys, .zhline .zys, .cap .zt, .zhline .zt { font-size: .4em; }
.zc.nz { width: auto; padding: 0 .08em; }
.zhline { display: inline-flex; flex-wrap: wrap; align-items: center; font-size: 26px; font-weight: 700; line-height: 1.05; }
.zhline .zc { width: 1.42em; }
.mean { align-items: center; }
.mean .muted { font-size: 14px; }
.opt .wcard .pic { max-height: 96px; }
.qpic .wcard .pic { max-height: 170px; }
.tk .wcard .pic { width: 80px; height: 64px; }
.lpic .wcard .pic { height: 58px; }
.qpic2 { width: auto; min-width: 74px; height: auto; padding: 4px; }
.qpic2 .wcard .pic { width: 74px; height: 56px; }
.mini .wcard .pic { width: 64px; height: 52px; }

/* body-part highlight: clear red ring the child can't miss */
.pic .bodyhl { fill: rgba(226, 72, 61, .16); stroke: #E03C31; stroke-width: 4.5; }

/* ---------- standard four-line grid (英文四線格) ---------- */
.four4 { display: block; width: 100%; height: auto; max-height: 190px; overflow: visible; }
.four4 .fl { stroke: var(--guide); stroke-width: 2.4; }
.four4 .fl.l3 { stroke: var(--vow); stroke-width: 3; opacity: .75; }   /* line 3 = baseline, red like school notebooks */
.four4 .fband { fill: var(--stage); opacity: .55; }
.four4 .fst { fill: none; stroke: var(--ink); stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
.four4 .fst.now { stroke: var(--cons); }
.four4 .ftr { fill: none; stroke: var(--guide); stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.four4 .fstart { fill: var(--ok); }
.four4 .fnum { font: 700 30px var(--f-en); fill: var(--ok); text-anchor: middle; }
.four4.answer .fst { stroke: var(--bad); opacity: .55; stroke-width: 12; }
.fourw { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.fourw.on .fst { stroke: var(--cons); }
.camb { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 2px 0 8px; color: var(--muted); font-size: 13px; }
.camb .ipa { font: 600 18px 'Charis SIL', 'Doulos SIL', 'Lucida Sans Unicode', 'Arial Unicode MS', var(--f-en); color: var(--ink); letter-spacing: .02em; }

/* ---------- writing session ---------- */
.wsteps { display: flex; gap: 6px; margin: 0 0 10px; flex-wrap: wrap; }
.wsteps span { padding: 4px 12px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.wsteps span.on { background: var(--sun); color: var(--sun-ink); border-color: transparent; font-weight: 700; }
.wsteps span.done { color: var(--ok); }
.whead { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.whead .wpic { width: 96px; flex: none; }
.whead .wpic .pic, .whead .wpic svg { width: 96px; height: auto; max-height: 96px; }
.whead .wmean { display: grid; gap: 8px; font-size: 22px; }
.wrbox { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
.wtip { color: var(--muted); margin: 10px 2px; font-size: 15px; line-height: 1.6; }
.pad { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; --ink: #1F3B73; }
.pad .four4 { max-height: none; height: clamp(170px, 34vh, 300px); width: 100%; }
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.pad .padover { position: absolute; inset: 0; pointer-events: none; }
.pad .padover .four4 { height: 100%; max-height: none; }
.pad .padover .fl, .pad .padover .fband { display: none; }
.wmsg { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--stage); display: grid; gap: 8px; font-size: 16px; }
.wmsg .wl { font-size: 22px; font-weight: 700; color: var(--vow); letter-spacing: .1em; }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.bad { color: var(--bad); border-color: var(--bad); }
.wlist { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.witem { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px 6px 6px; }
.witem .four4 { max-height: 80px; }
.witem span { position: absolute; top: 6px; right: 10px; font-weight: 700; color: var(--ok); }
.witem.redo span { color: var(--vow); }
.wintro { display: grid; grid-template-columns: 180px 1fr; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 8px; }
.wintro p { margin: 4px 0 0; color: var(--muted); }
.chip.wsel.on { outline: 3px solid var(--sun); }
@media (max-width: 520px) { .wintro { grid-template-columns: 1fr; } .whead .wpic { width: 72px; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pad { --ink: #CFE0FF; } }
:root[data-theme="dark"] .pad { --ink: #CFE0FF; }
.wrbox > .four4 { max-height: 250px; }

</style>

function portrait(p) {
  const kid = p.kid, baby = p.baby;
  const cx = 50, cy = baby ? 54 : kid ? 50 : 44, r = baby ? 19 : kid ? 19 : 20;
  const o = 'class="o" stroke-width="2.2"';
  let s = '';
  // back hair
  if (p.hair === 'long') s += `<path d="M${cx - r - 5} ${cy - 4} Q${cx - r - 6} ${cy - r - 8} ${cx} ${cy - r - 6} Q${cx + r + 6} ${cy - r - 8} ${cx + r + 5} ${cy - 4} L${cx + r + 7} ${cy + r + 12} Q${cx} ${cy + r + 18} ${cx - r - 7} ${cy + r + 12} Z" fill="${p.hc}" ${o}/>`;
  if (p.hair === 'bob') s += `<path d="M${cx - r - 5} ${cy} Q${cx - r - 6} ${cy - r - 8} ${cx} ${cy - r - 6} Q${cx + r + 6} ${cy - r - 8} ${cx + r + 5} ${cy} L${cx + r + 5} ${cy + 12} Q${cx + r} ${cy + 16} ${cx + r - 3} ${cy + 12} L${cx - r + 3} ${cy + 12} Q${cx - r} ${cy + 16} ${cx - r - 5} ${cy + 12} Z" fill="${p.hc}" ${o}/>`;
  if (p.hair === 'pigtails') s += `<circle cx="${cx - r - 6}" cy="${cy + 2}" r="7" fill="${p.hc}" ${o}/><circle cx="${cx + r + 6}" cy="${cy + 2}" r="7" fill="${p.hc}" ${o}/><circle cx="${cx - r - 1}" cy="${cy - 2}" r="2.6" fill="#E2483D"/><circle cx="${cx + r + 1}" cy="${cy - 2}" r="2.6" fill="#E2483D"/>`;
  if (p.hair === 'pony') s += `<ellipse cx="${cx + r + 6}" cy="${cy + 4}" rx="6" ry="11" fill="${p.hc}" ${o}/>`;
  if (p.hair === 'bun') s += `<circle cx="${cx}" cy="${cy - r - 5}" r="8" fill="${p.hc}" ${o}/>`;
  // body / shoulders
  const sw = baby ? 26 : kid ? 30 : 36, top = cy + r - 2;
  s += `<path d="M${cx - sw} 100 Q${cx - sw} ${top + 6} ${cx - 8} ${top} L${cx + 8} ${top} Q${cx + sw} ${top + 6} ${cx + sw} 100 Z" fill="${p.shirt}" ${o}/>`;
  if (baby) s += `<path d="M${cx - 11} ${top + 1} Q${cx} ${top + 16} ${cx + 11} ${top + 1} Z" fill="#FFFFFF" ${o}/>`;
  if (p.tie) s += `<path d="M${cx} ${top + 1} l-4 4 l4 18 l4 -18 Z" fill="#E2483D" ${o}/>`;
  if (p.star) s += `<path d="M${cx} ${top + 7} l2.6 5.4 5.9 .8 -4.3 4.1 1 5.8 -5.2 -2.8 -5.2 2.8 1 -5.8 -4.3 -4.1 5.9 -.8 Z" fill="#FFFFFF" ${o} stroke-width="1.4"/>`;
  if (p.book) s += `<rect x="${cx + 8}" y="${top + 8}" width="16" height="12" rx="2" fill="#FFFFFF" ${o}/><line x1="${cx + 16}" y1="${top + 8}" x2="${cx + 16}" y2="${top + 20}" class="o" stroke-width="1.6"/>`;
  // ears + head
  s += `<circle cx="${cx - r}" cy="${cy + 2}" r="4.2" fill="${p.skin}" ${o}/><circle cx="${cx + r}" cy="${cy + 2}" r="4.2" fill="${p.skin}" ${o}/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.skin}" ${o}/>`;
  // front hair
  const cap = (c) => `<path d="M${cx - r - 1} ${cy - 1} A${r + 1} ${r + 1} 0 0 1 ${cx + r + 1} ${cy - 1} Q${cx + r - 3} ${cy - r + 4} ${cx + 2} ${cy - r + 7} Q${cx - r + 4} ${cy - r + 5} ${cx - r - 1} ${cy - 1} Z" fill="${c}" ${o}/>`;
  if (['short', 'long', 'bob', 'pigtails', 'pony', 'bun', 'tuft'].includes(p.hair)) s += cap(p.hc);
  if (p.hair === 'tuft') s += `<path d="M${cx - 3} ${cy - r - 1} q2 -9 9 -8 q-5 3 -3 9 Z" fill="${p.hc}" ${o}/>`;
  if (p.hair === 'bald') s += `<ellipse cx="${cx - r + 2}" cy="${cy - 5}" rx="5" ry="7" fill="${p.hc}" ${o}/><ellipse cx="${cx + r - 2}" cy="${cy - 5}" rx="5" ry="7" fill="${p.hc}" ${o}/>`;
  if (p.hair === 'curl') s += `<path d="M${cx - 2} ${cy - r + 1} q-2 -9 6 -9 q6 1 3 7 q-3 3 -5 -1" fill="none" class="o" stroke-width="2.4"/>`;
  if (p.hair === 'cap') s += `<path d="M${cx - r - 1} ${cy - 2} A${r + 1} ${r + 1} 0 0 1 ${cx + r + 1} ${cy - 2} Z" fill="#E2483D" ${o}/><path d="M${cx + 2} ${cy - 2} h${r + 12} q2 4 -3 5 h-${r + 9} Z" fill="#C0352B" ${o}/>`;
  if (p.band) s += `<path d="M${cx - r + 1} ${cy - 8} Q${cx} ${cy - r - 6} ${cx + r - 1} ${cy - 8}" fill="none" stroke="#2F6FD6" stroke-width="3.5"/>`;
  if (p.bow) s += `<path d="M${cx - 12} ${cy - r + 1} l-7 -5 v10 Z M${cx - 12} ${cy - r + 1} l7 -5 v10 Z" fill="#E2483D" ${o} stroke-width="1.4"/>`;
  if (p.crown) s += `<path d="M${cx - 13} ${cy - r + 2} l-2 -13 7 7 6 -10 6 10 7 -7 -2 13 Z" fill="#F2B21B" ${o}/>`;
  if (p.hat) s += `<path d="M${cx - 9} ${cy - r + 3} L${cx + 2} ${cy - r - 18} L${cx + 11} ${cy - r + 4} Z" fill="#8B4FD6" ${o}/><circle cx="${cx + 2}" cy="${cy - r - 19}" r="3" fill="#F2B21B" ${o} stroke-width="1.4"/>`;
  // face
  const ey = cy + (baby ? 3 : 1);
  s += `<circle cx="${cx - 7}" cy="${ey}" r="2.3" class="f"/><circle cx="${cx + 7}" cy="${ey}" r="2.3" class="f"/>`;
  s += `<circle cx="${cx - 12}" cy="${ey + 6}" r="3.2" fill="#F08F8F" opacity=".45"/><circle cx="${cx + 12}" cy="${ey + 6}" r="3.2" fill="#F08F8F" opacity=".45"/>`;
  if (p.glasses) s += `<circle cx="${cx - 7}" cy="${ey}" r="5.4" fill="none" class="o" stroke-width="1.8"/><circle cx="${cx + 7}" cy="${ey}" r="5.4" fill="none" class="o" stroke-width="1.8"/><line x1="${cx - 1.6}" y1="${ey}" x2="${cx + 1.6}" y2="${ey}" class="o" stroke-width="1.8"/>`;
  if (p.beard) s += `<path d="M${cx - r + 3} ${cy + 4} Q${cx - r + 4} ${cy + r + 3} ${cx} ${cy + r + 3} Q${cx + r - 4} ${cy + r + 3} ${cx + r - 3} ${cy + 4} Q${cx} ${cy + 16} ${cx - r + 3} ${cy + 4} Z" fill="${p.hc}" ${o}/>`;
  if (p.mustache) s += `<path d="M${cx - 8} ${cy + 9} Q${cx} ${cy + 4} ${cx + 8} ${cy + 9} Q${cx} ${cy + 7} ${cx - 8} ${cy + 9} Z" fill="${p.hc}" ${o} stroke-width="1.4"/>`;
  if (baby) s += `<circle cx="${cx}" cy="${cy + 11}" r="4.5" fill="#F2B21B" ${o} stroke-width="1.6"/><circle cx="${cx}" cy="${cy + 11}" r="1.6" fill="#FFFFFF"/>`;
  else s += `<path d="M${cx - 6} ${cy + 9} Q${cx} ${cy + 15} ${cx + 6} ${cy + 9}" fill="none" class="o" stroke-width="2.2" stroke-linecap="round"/>`;
  if (p.earrings) s += `<circle cx="${cx - r}" cy="${cy + 8}" r="2.2" fill="#F2B21B"/><circle cx="${cx + r}" cy="${cy + 8}" r="2.2" fill="#F2B21B"/>`;
  return s;
}

function svg(vb, inner, cls = '') {
  return `<svg viewBox="${vb}" class="pic ${cls}" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">${inner}</svg>`;
}
function person(key, cls) { return svg('0 0 100 100', portrait(PEOPLE[key]), cls); }

/* ---- family tree ---- */
// portrait boxes are 60 x 60 (scale .6); x = centre, y = top of the box
const TREE = {
  grandpa: [197.5, 8], grandma: [277.5, 8],
  aunt: [60, 110], uncle: [140, 110], dad: [335, 110], mom: [415, 110],
  cousin: [100, 214], brother: [270, 214], me: [340, 214], sister: [410, 214], baby: [480, 214],
};
function headTop(k) { const p = PEOPLE[k]; return TREE[k][1] + (p.baby ? 33 : p.kid ? 29 : 22) * .6; }
function tree(hl) {
  const all = hl === 'family';
  const T = TREE, face = (k) => T[k][1] + 26;
  const gp = (T.grandpa[0] + T.grandma[0]) / 2, au = (T.aunt[0] + T.uncle[0]) / 2, dm = (T.dad[0] + T.mom[0]) / 2;
  const bar1 = 96, bar2 = 200, g = 5;
  let d = '';
  d += `M${T.grandpa[0] + 17} ${face('grandpa')} H${T.grandma[0] - 17} M${gp} ${face('grandpa')} V${bar1} M${T.uncle[0]} ${bar1} H${T.dad[0]}`;
  d += ` M${T.uncle[0]} ${bar1} V${headTop('uncle') - g} M${T.dad[0]} ${bar1} V${headTop('dad') - g}`;
  d += ` M${T.aunt[0] + 17} ${face('aunt')} H${T.uncle[0] - 17} M${au} ${face('aunt')} V${headTop('cousin') - g}`;
  d += ` M${T.dad[0] + 17} ${face('dad')} H${T.mom[0] - 17} M${dm} ${face('dad')} V${bar2} M${T.brother[0]} ${bar2} H${T.baby[0]}`;
  ['brother', 'me', 'sister', 'baby'].forEach((k) => { d += ` M${T[k][0]} ${bar2} V${headTop(k) - g}`; });
  let s = `<path class="ln" d="${d}" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  for (const [k, [x, y]] of Object.entries(T)) {
    const on = all || k === hl;
    const dim = hl && !on ? ' opacity=".28"' : '';
    if (on && !all) s += `<circle cx="${x}" cy="${y + 30}" r="36" class="hl pulse"/>`;
    s += `<g transform="translate(${x - 30} ${y}) scale(.6)"${dim}>${portrait(PEOPLE[k])}</g>`;
    if (on && !all) s += `<g><rect x="${x - 34}" y="${y + 56}" width="68" height="20" rx="10" class="tagbg"/><text x="${x}" y="${y + 70.5}" text-anchor="middle" class="tagtx">${k}</text></g>`;
  }
  return svg('0 0 540 292', s, 'wide');
}

  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; pts.push((x + rr * Math.cos(a)).toFixed(1) + ',' + (y + rr * Math.sin(a)).toFixed(1)); }
  return `<polygon points="${pts.join(' ')}" fill="${fill}"/>`;
}

const saySyl = (s) => s.k && AUD[s.k] ? playKey(s.k) : (s.ph && AUD['y:' + s.ph] ? playKey('y:' + s.ph) : tts(s.t, 0.7));
function stopAll() { chain++; try { player.pause(); } catch (e) { } try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { } }
function tone(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [[660, 0], [990, 0.11]] : [[220, 0], [180, 0.12]];
    notes.forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(ok ? 0.25 : 0.18, actx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d + 0.22);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.25);
    });
  } catch (e) { }
}

function thumb(w) { return w.pic ? pic(w.pic, { small: true }) : `<div class="en" style="font-weight:700;font-size:18px;color:var(--cons);height:48px;display:grid;place-items:center">Aa</div>`; }

  h += `<div class="dock"><div class="info">已選 <b class="en" id="nsel">${sel.size}</b> 個字</div><button class="btn sm" id="clr">清除</button><button class="btn" id="wstart" ${sel.size ? '' : 'disabled'}>✍️ 寫字</button><button class="btn sun" id="start" ${sel.size ? '' : 'disabled'}>開始學 →</button></div>`;
  render(h);
  loadBundle('common'); loadBundle(u.id);
  const upd = () => { ST.sel = [...sel]; save(); document.getElementById('nsel').textContent = sel.size; document.getElementById('start').disabled = !sel.size; document.getElementById('wstart').disabled = !sel.size; };
  qa('.chip').forEach((c) => c.onclick = () => {
    const id = c.dataset.w;
    if (sel.has(id)) { sel.delete(id); c.classList.remove('on'); } else { sel.add(id); c.classList.add('on'); stopAll(); sayWord(getWord(id)); }
    upd();
  });
  qa('[data-tab]').forEach((b) => b.onclick = () => pick(b.dataset.tab === tab ? tab : b.dataset.tab));
  qa('[data-all]').forEach((b) => b.onclick = () => {
    const ws = u.groups.find((g) => g.id === b.dataset.all).words;
    const allOn = ws.every((w) => sel.has(w));

function tilesHTML(w) {

  w.syl.forEach((s, i) => {

      h += `<button class="tile ${base}" data-si="${i}" data-ti="${j}" aria-label="${esc(L)}"><span class="lt">${esc(L)}</span>${star ? STAR : ''}<span class="snd en">${esc(label || '')}</span></button>`;
    });

}
function learn(i = 0) {
  stopAll();
  const list = ST.sel.map(getWord).filter(Boolean);
  if (!list.length) return pick();
  i = Math.max(0, Math.min(i, list.length - 1));
  withAudio(unitsFor(ST.sel), () => learnCard(list, i));
}
function learnCard(list, i) {
  const w = list[i];
  const phrase = w.kind === 'phrase';
  const nsyl = w.syl ? w.syl.filter((s) => !s.wb || true).length : 0;
  const re = new RegExp(`\\b(${w.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}s?)\\b`, 'i');
  const exHTML = w.ex && !phrase ? esc(w.ex).replace(re, '<mark>$1</mark>') : '';
  const fs = Math.min(58, Math.floor(520 / Math.max(4, w.w.length)));
  const u = w.units && w.units[0] ? UMAP[w.units[0]] : null;
  let h = bar('今天的單字', 'pick', `<span class="count">${i + 1} / ${list.length}</span>`);
  h += `<div class="prog" style="margin-bottom:12px">${list.map((_, k) => `<i class="${k === i ? 'on' : k < i ? 'done' : ''}"></i>`).join('')}</div>`;
  h += `<div class="card"><div class="stage">${bigPic(w)}</div>
    <div class="mean"><span class="zh">${w.cap ? zhInline(w.cap) : esc(w.zh || '')}</span>${w.cap && w.zh && w.zh !== w.cap ? `<span class="muted">${esc(w.zh)}</span>` : ''}${u ? `<span class="unit">${uLabel(u)}</span>` : ''}<span class="sp"></span>${!phrase && !w.custom ? `<span class="claps"><b>${nsyl}</b> 個音節：<b>${w.syl.map((s) => esc(s.t)).join(' · ')}</b></span>` : ''}</div>`;
  if (phrase) h += `<div class="phrase en">${esc(w.w)}</div><div class="ctl two"><button class="btn sun" id="bw">🔊 念一次</button><button class="btn" id="bslow">慢慢念</button></div>`;
  else h += `${tilesHTML(w)}${w.cam ? `<div class="camb"><span>劍橋字典 美式發音</span><b class="ipa">${esc(w.cam)}</b></div>` : ''}<div class="fourw" id="fw">${fourWord(w.w, 'solid')}</div>
    <div class="ctl"><button class="btn sun" id="bw">🔊 念一次</button><button class="btn" id="bs">慢慢拼</button><button class="btn" id="be" ${w.ex ? '' : 'disabled'}>聽例句</button></div>
    <div class="ctl two"><button class="btn" id="bhow">✍️ 看寫法</button><button class="btn" id="bwrite">寫寫看 →</button></div>
    ${w.ex ? `<div class="ex"><span class="s">${exHTML}</span><span class="t">${esc(w.exzh)}</span></div>` : ''}`;
  if (w.tip) h += `<div class="tip"><b>發音小撇步</b><span>${esc(w.tip)}</span></div>`;
  h += `</div><div class="row" style="margin-top:14px"><button class="btn" id="prev" ${i ? '' : 'disabled'}>← 上一個</button><span class="sp"></span>${i < list.length - 1 ? '<button class="btn primary" id="next">下一個 →</button>' : '<button class="btn sun" id="next">開始練習 →</button>'}</div>
  ${phrase ? '' : `<div style="margin-top:16px">${legendHTML()}</div>`}`;
  render(h);
  const card = app.querySelector('.card');
  qa('.tile', card).forEach((t) => t.onclick = () => {
    stopAll(); const g = w.syl[t.dataset.si].g[t.dataset.ti];
    t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 500);
    if (g[2] && g[2] !== '-') sayPh(g[2]); else if (w.custom) tts(g[0]);
  });
  qa('.sb', card).forEach((b) => b.onclick = () => {
    stopAll(); const s = w.syl[b.dataset.syl]; const el = b.parentElement; el.classList.add('on');
    saySyl(s).then(() => el.classList.remove('on'));
  });
  document.getElementById('bw').onclick = () => { stopAll(); sayWord(w); };
  const be = document.getElementById('be'); if (be) be.onclick = () => { stopAll(); if (w.ex) saySent(w.ex); };
  const bs = document.getElementById('bs'); if (bs) bs.onclick = () => spell(w);
  const bsl = document.getElementById('bslow'); if (bsl) bsl.onclick = () => { stopAll(); sayWord(w, true); };
  const bh = document.getElementById('bhow'); if (bh) bh.onclick = () => { stopAll(); animateWord(app.querySelector('#fw .four4')); };
  const bwr = document.getElementById('bwrite'); if (bwr) bwr.onclick = () => writeWords([w.id], { title: '寫寫看', back: `learn|${i}` });
  document.getElementById('prev').onclick = () => { stopAll(); learnCard(list, i - 1); };
  document.getElementById('next').onclick = () => { stopAll(); i < list.length - 1 ? learnCard(list, i + 1) : startPractice(); };
  sayWord(w);
}
async function spell(w) {
  stopAll(); const id = chain;
  const fw = document.getElementById('fw');
  if (w.custom) { await tts(w.w, 0.5); return; }
  for (let i = 0; i < w.syl.length; i++) {
    const s = w.syl[i];
    for (let j = 0; j < s.g.length; j++) {
      if (id !== chain) return;
      const t = app.querySelector(`.tile[data-si="${i}"][data-ti="${j}"]`);
      t && t.classList.add('on');
      if (s.g[j][2] !== '-') await sayPh(s.g[j][2]); else await wait(450);
      await wait(120);
      t && t.classList.remove('on');
    }
    if (id !== chain) return;
    const sy = app.querySelector(`.syl[data-si="${i}"]`); sy && sy.classList.add('on');
    await saySyl(s); await wait(150);
    sy && sy.classList.remove('on');
  }
  if (id !== chain) return;
  fw && fw.classList.add('on');
  await sayWord(w, true); await wait(250);
  if (id !== chain) return;
  await sayWord(w);
  fw && fw.classList.remove('on');
}

/* ================= QUIZ ENGINE ================= */
let Q = null;
function prep(it) {
  it = JSON.parse(JSON.stringify(it));
  if (it.kind === 'choice' && it.shuf !== false) {
    const right = it.opts[it.ans];
    it.opts = shuffle(it.opts); it.ans = it.opts.indexOf(it.opts.find((o) => o === right || JSON.stringify(o) === JSON.stringify(right)));
  }
  return it;
}
function runQuiz(items, cfg) {
  Q = { items: items.map(prep), i: 0, cfg, first: 0, total: items.length, retried: new Set(), answers: [] };
  showQ();
}
function optHTML(o, k) {
  if (o.p) return `<button class="opt" data-k="${k}">${cpic(o.p, { small: true })}</button>`;
  if (o.ico) return `<button class="opt txt" data-k="${k}">${o.ico === 'sun' ? iconSun() : iconMoon()}<span>${esc(o.html)}</span></button>`;
  return `<button class="opt txt" data-k="${k}">${esc(o.t)}</button>`;
}
function playItem(it) {
  if (!it.say) return Promise.resolve();
  return saySent(it.say.replace(/^x:/, ''));
}
function showQ() {
  stopAll();
  const it = Q.items[Q.i];
  if (!it) return Q.cfg.onDone(Q);
  const test = Q.cfg.mode === 'test';
  let inner = `<div class="ask">${it.say ? '<button class="say" id="sayb" aria-label="再聽一次">🔊</button>' : ''}<span>${esc(it.ask)}</span></div>`;
  if (it.passage) inner += `<div class="ex"><div class="row" style="justify-content:space-between"><b>短文</b><button class="btn sm" id="psay">🔊 聽短文</button></div>${it.passage.map((l) => `<span class="s" style="font-size:19px">${esc(l)}</span>`).join('')}</div>`;
  if (it.bigsay) inner += `<button class="big-say" id="bigsay" aria-label="播放">🔊</button>`;
  if (it.pic) inner += `<div class="qpic">${cpic(it.pic, { small: it.picSmall !== false })}</div>`;
  if (it.sent) inner += `<div class="sentence">${it.sentHTML || sentHTML(it.sent)}</div>`;
  if (it.zh) inner += `<div class="muted" style="text-align:center">${esc(it.zh)}</div>`;
  if (it.kind === 'choice') inner += `<div class="opts ${it.cols === 3 || (it.opts.length === 3 && it.opts[0].p) ? 'three' : ''} ${it.opts.some((o) => (o.t || '').length > 11) ? 'one' : ''}">${it.opts.map(optHTML).join('')}</div>`;
  if (it.kind === 'tf') inner += `<div class="tfrow"><button class="tfbtn t" data-k="1" aria-label="對">✓</button><button class="tfbtn f" data-k="0" aria-label="錯">✗</button></div>`;
  if (it.kind === 'build') inner += buildHTML(it);
  if (it.kind === 'match') inner += `<div class="match"></div>`;
  inner += `<div class="feedback" id="fb"></div>`;
  if (test) inner += `<div class="row"><button class="btn" id="qprev" ${Q.i ? '' : 'disabled'}>← 上一題</button><span class="sp"></span><button class="btn primary" id="qnext" disabled>${Q.i === Q.items.length - 1 ? '交卷 ✓' : '下一題 →'}</button></div>`;
  const head = bar(Q.cfg.title, Q.cfg.back, `<span class="count">${Q.i + 1} / ${Q.items.length}</span>`) + (it.part ? `<div class="section-label">${esc(it.part)}</div>` : '');
  app.innerHTML = `<div class="wrap">${head}<div class="q">${inner}</div></div>`;
  wire(); window.scrollTo(0, 0);

  });

  qa('#sheet .q-yn .cb').forEach((b) => b.onclick = () => {

    qa('.lpic', box).forEach((b) => b.onclick = () => {
      if (QZ.done || cur === null) return; A[k] = A[k] || {};
      for (const li in A[k]) if (A[k][li] === b.dataset.rj) delete A[k][li];
      A[k][cur] = b.dataset.rj; cur = null; qa('.lnum', box).forEach((x) => x.classList.remove('sel')); drawLines(box);

function gradeQuiz() {
  const Z = QZ; Z.done = true; let got = 0, tot = 0;
  Z.parts.forEach((p, pi) => p.items.forEach((it, ii) => {
    const k = qid(pi, ii); const a = Z.ans[k]; const el = document.getElementById(k); let g = 0;
    switch (it.t) {
      case 'tick': case 'letter': case 'circle': case 'rq':
        g = a === it.ans ? 1 : 0;
        qa(`[data-k="${k}"][data-v="${it.ans}"]`, el).forEach((x) => x.classList.add('right'));
        if (a !== undefined && a !== it.ans) qa(`[data-k="${k}"][data-v="${a}"]`, el).forEach((x) => x.classList.add('wrongc'));
        break;
      case 'tf':
        g = a !== undefined && (a === 1) === it.ans ? 1 : 0;
        qa(`[data-k="${k}"][data-v="${it.ans ? 1 : 0}"]`, el).forEach((x) => x.classList.add('right'));
        if (!g && a !== undefined) qa(`[data-k="${k}"][data-v="${a}"]`, el).forEach((x) => x.classList.add('wrongc'));
        break;
      case 'yn':
        it.st.forEach((s, j) => { const v = a && a[j]; const ok = v !== undefined && (v === 1) === s.ans; if (ok) g++; qa(`[data-k="${k}"][data-j="${j}"][data-v="${s.ans ? 1 : 0}"]`, el).forEach((x) => x.classList.add('right')); if (!ok && v !== undefined) qa(`[data-k="${k}"][data-j="${j}"][data-v="${v}"]`, el).forEach((x) => x.classList.add('wrongc')); });
        break;
      case 'lines':
        it.left.forEach((_, li) => { if (a && a[li] !== undefined && it.right[a[li]] === it.ans[li]) g++; });
        drawLines(el.querySelector('.lines-box'));
        el.insertAdjacentHTML('beforeend', `<div class="fix">正確：${it.labels.map((l, i) => `${i + 1}–<span class="en">${esc(l)}</span>`).join('　')}</div>`);
        break;
      case 'color':
        it.objs.forEach((o, i) => { if (a && a[i] === o.color) g++; });
        el.insertAdjacentHTML('beforeend', `<div class="fix en">${it.objs.map((o, i) => `${i + 1}. ${esc(o.say)}`).join('　')}</div>`);
        break;
      case 'unscr': {
        const word = a ? a.map((j) => (j === null ? '' : it.letters[j])).join('') : '';
        g = word === it.word ? 1 : 0;
        if (!g) el.insertAdjacentHTML('beforeend', `<div class="fix">正確：<b class="en">${esc(it.word)}</b></div>`);
        break; }
      case 'cloze':
        it.ans.forEach((w, gi) => { const ok = a && a[gi] === w; if (ok) g++; const gp = el.querySelector(`.gap2[data-g="${gi}"]`); gp.classList.add(ok ? 'right' : 'wrongc'); if (!ok) gp.insertAdjacentHTML('beforeend', `<em class="en">${esc(w)}</em>`); });
        break;

    el.classList.add(g === it.pts ? 'okq' : g === 0 ? 'badq' : 'halfq');
    el.querySelector(':scope > .qmark').textContent = g === it.pts ? '✓' : it.pts > 1 ? `${g}/${it.pts}` : '✗';
  }));
  const score = Math.round(got / tot * 100);
  document.getElementById('score').innerHTML = `<b>${score}</b><span>/ 100</span>`;
  document.getElementById('score').classList.add('graded');
  document.getElementById('foot').innerHTML = `<div class="sh-result">答對 ${got} / ${tot}，<b>${score} 分</b>。紅色是正確答案。</div><div class="row"><button class="btn" id="again">再考一張（題目會換）</button><span class="sp"></span><button class="btn primary" data-go="quiz">回小考區</button></div>`;

/* ---------- drawing ---------- */
const WPAD = 34;
function ptsPath(p) { return 'M' + p.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join('L'); }
function plen(p) { let s = 0; for (let i = 1; i < p.length; i++) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return s; }
function gridSVG(w, inner = '', cls = '') {
  const W = w + WPAD * 2;
  const lines = [0, 100, 200, 300].map((y, i) => `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="fl l${i + 1}"/>`).join('');
  return `<svg class="four4 ${cls}" viewBox="${-WPAD} -30 ${W} 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g transform="translate(${-WPAD} 0)"><rect x="0" y="100" width="${W}" height="100" class="fband"/>${lines}</g>${inner}</svg>`;
}
/** the word written on the four lines.  mode: 'solid' | 'trace' (light, with start dots) | 'anim' */
function fourWord(text, mode = 'solid') {
  const L = WF.layout(text);
  let s = '';
  L.letters.forEach((lt) => lt.strokes.forEach((st, k) => {
    const d = ptsPath(st);
    if (mode === 'trace') s += `<path d="${d}" class="ftr"/>`;
    else s += `<path d="${d}" class="fst" data-len="${plen(st).toFixed(0)}"/>`;
  }));
  if (mode === 'trace') L.letters.forEach((lt) => lt.strokes.forEach((st, k) => {
    const [x, y] = st[0]; const [x2, y2] = st[Math.min(3, st.length - 1)];
    if (plen(st) < 12) return;
    s += `<circle cx="${x}" cy="${y}" r="9" class="fstart"/>`;
    if (lt.strokes.length > 1) s += `<text x="${x + (x2 >= x ? -16 : 16)}" y="${y - 10}" class="fnum">${k + 1}</text>`;

/** stroke-by-stroke animation of the word on an existing .four4 svg */

  const id = chain;
  const paths = [...svgEl.querySelectorAll('.fst')];
  paths.forEach((p) => { const L = +p.dataset.len || 100; p.style.transition = 'none'; p.style.strokeDasharray = L + ' ' + (L + 40); p.style.strokeDashoffset = L; p.style.visibility = 'hidden'; });
  svgEl.getBoundingClientRect();
  for (const p of paths) {

    const L = +p.dataset.len || 100; const t = Math.max(220, Math.min(msPer, L * 2.6));
    p.style.visibility = 'visible'; p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset ${t}ms linear`; p.style.strokeDashoffset = 0; p.classList.add('now');
    await wait(t + 120); p.classList.remove('now');

  paths.forEach((p) => { p.style.transition = 'none'; p.style.strokeDashoffset = 0; p.style.visibility = 'visible'; });
}

/* ---------- a writing pad on top of the four lines ---------- */
function makePad(host, text, mode) {
  // mode 'trace' shows the light letters; 'free' only the lines
  const L = WF.layout(text);
  const vbW = L.w + WPAD * 2;
  host.innerHTML = `<div class="pad">${mode === 'trace' ? fourWord(text, 'trace') : gridSVG(L.w, '', 'free')}<canvas></canvas><div class="padover"></div></div>`;
  const box = host.querySelector('.pad'), cv = host.querySelector('canvas'), over = host.querySelector('.padover');
  const strokes = []; let cur = null, penSeen = false;
  const geo = () => { const r = cv.getBoundingClientRect(); const k = Math.min(r.width / vbW, r.height / 360); return { r, k, ox: (r.width - vbW * k) / 2, oy: (r.height - 360 * k) / 2 }; };

  }

    if (e.pointerType === 'pen') penSeen = true;

  });

    strokes, layout: L, over,
    clear() { strokes.length = 0; redraw(); box.classList.remove('inked'); over.innerHTML = ''; },
    undo() { strokes.pop(); redraw(); if (!strokes.length) box.classList.remove('inked'); },
    showAnswer() { over.innerHTML = fourWord(text, 'solid').replace('class="four4 solid"', 'class="four4 solid answer"'); },
    destroy() { ro.disconnect(); },
  };

}

/* how well did the child trace?  coverage of the model strokes + how much ink wandered off */
function traceScore(pad) {
  const guide = []; pad.layout.letters.forEach((lt) => lt.strokes.forEach((s) => { for (let i = 0; i < s.length; i += 1) guide.push(s[i]); }));
  const inkPts = []; pad.strokes.forEach((s) => { for (let i = 0; i < s.length; i++) { inkPts.push(s[i]); if (i) { const a = s[i - 1], b = s[i]; const n = Math.floor(Math.hypot(b[0] - a[0], b[1] - a[1]) / 6); for (let k = 1; k < n; k++) inkPts.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]); } } });
  if (!inkPts.length) return { cover: 0, off: 0, stars: 0, perLetter: [] };
  const near = (p, set, tol) => set.some((q) => Math.abs(q[0] - p[0]) < tol && Math.abs(q[1] - p[1]) < tol && Math.hypot(q[0] - p[0], q[1] - p[1]) < tol);
